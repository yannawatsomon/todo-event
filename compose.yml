services:
  mongo:
    image: mongo:8
    container_name: todoe-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: todoe
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: todoe-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8
    container_name: todoe-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todoe_onboarding
      MYSQL_USER: todoe
      MYSQL_PASSWORD: todoe
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:latest
    container_name: todoe-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:latest
    container_name: todoe-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

  onboarding:
    build:
      context: .
      dockerfile: cmd/onboarding/Dockerfile
    container_name: todoe-onboarding
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      MYSQL_DSN: todoe:todoe@tcp(mysql:3306)/todoe_onboarding?parseTime=true&multiStatements=true
      MONGO_URI: mongodb://root:root@mongo:27017
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  audit:
    # ── Node.js audit service (cmd/audit-node) ────────────────────────────────
    # Replaced from the original Go service (cmd/audit/Dockerfile).
    # The Go source at cmd/audit/ is preserved — only this compose entry changed.
    #
    # Responsibilities (identical to the Go version):
    #   - Subscribe to "task.events"       → push every task event to Loki
    #   - Subscribe to "onboarding.events" → push every user/onboarding event to Loki
    #
    # To revert to the Go version, change the dockerfile line back to:
    #   dockerfile: cmd/audit/Dockerfile
    build:
      context: .
      dockerfile: cmd/audit-node/Dockerfile
    container_name: todoe-audit
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      LOKI_URL: http://loki:3100
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  mongo-data:
  grafana-data:
  rabbit-data:
  mysql-data:
